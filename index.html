<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SolimanFionaWedding</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #000000;
        }
        /* 开场遮罩 */
        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.65);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .start-text {
            color: #ffffff;
            font-size: 22px;
            letter-spacing: 3px;
            font-family: serif;
            text-shadow: 0 0 8px #e8d8ff, 0 0 16px #c8b0e8, 0 0 24px #b090d8;
            animation: dreamBreath 3.2s ease-in-out infinite alternate;
        }
        @keyframes dreamBreath {
            0% {
                opacity: 0.75;
                text-shadow: 0 0 4px #e8d8ff, 0 0 10px #c8b0e8, 0 0 16px #b090d8;
            }
            100% {
                opacity: 1;
                text-shadow: 0 0 12px #f0e4ff, 0 0 22px #d4bcf0, 0 0 32px #bc9ee0;
            }
        }

        .video-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        .invite-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* RSVP点击区域，z-index高于视频，先开启红色调试底色，调试完成再注释 */
        .click-link-btn{
            position:absolute;
            bottom:12vh;
            left:20vw;
            right:20vw;
            height:12vh;
            z-index:960;
            /* 👇调试阶段保留红色，看到色块代表按钮真实存在，上线再注释这一行 */
            background:rgba(255,0,0,0.25);
            display:flex;
            align-items:center;
            justify-content:center;
            color:#fff;
        }
        /* 未打开请柬，直接禁止点击 */
        .click-link-btn.disabled{
            pointer-events:none;
        }

        .bgm-player {
            position: fixed;
            bottom: 16px;
            left: 16px;
            width: 72px;
            height: 34px;
            z-index: 999;
            opacity: 0.7;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="start-overlay" id="overlay">
        <div class="start-text">Click to Open Your Invitation</div>
    </div>

    <div class="video-container" id="videoWrap">
        <video class="invite-video" muted loop playsinline>
            <source src="./SolimanFionaWedding.mp4" type="video/mp4">
        </video>
        <!-- a标签里面增加占位文字，防止Safari忽略空a标签 -->
        <a id="rsvpBtn" class="click-link-btn disabled" href="https://zhengfangyuan128-jpg.github.io/SolimanFangyuanwedding/" target="_blank">RSVP</a>
    </div>

    <audio class="bgm-player" controls preload="auto" loop>
        <source src="./A.mp3" type="audio/mpeg">
    

    <script>
        const audio = document.querySelector('.bgm-player');
        const overlay = document.getElementById('overlay');
        const video = document.querySelector('.invite-video');
        const rsvpBtn = document.getElementById('rsvpBtn');

        overlay.addEventListener('click', ()=>{
            overlay.style.display = 'none';
            // 移除disabled，启用RSVP点击
            rsvpBtn.classList.remove('disabled');
            video.play();
            if(audio.paused) audio.play();
        });
    </script>
</body>
</html>
