<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SolimanFionaWedding</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #000000;
        }
        /* 开场点击遮罩层 */
        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.65);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 梦幻呼吸发光文字特效 */
        .start-text {
            color: #ffffff;
            font-size: 22px;
            letter-spacing: 3px;
            font-family: serif;
            /* 柔光外发光 */
            text-shadow: 0 0 8px #e8d8ff, 0 0 16px #c8b0e8, 0 0 24px #b090d8;
            animation: dreamBreath 3.2s ease‑in‑out infinite alternate;
        }
        @keyframes dreamBreath {
            0% {
                opacity: 0.75;
                text-shadow: 0 0 4px #e8d8ff, 0 0 10px #c8b0e8, 0 0 16px #b090d8;
            }
            100% {
                opacity: 1;
                text-shadow: 0 0 12px #f0e4ff, 0 0 22px #d4bcf0, 0 0 32px #bc9ee0;
            }
        }
        /* 全屏视频容器 */
        .video-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        .invite-video {
            width: 100%;
            height: 100%;
            object‑fit: cover;
            display: block;
        }
        /* 透明RSVP点击跳转按钮 */
        .click‑link‑btn{
            position:absolute;
            bottom:12vh;
            left:20vw;
            right:20vw;
            height:12vh;
            z‑index:900;
            /*调试定位时启用，正式上线务必删除下面一行*/
            /* background:rgba(255,0,0,0.2); */
        }
        /* 左下角迷你播放器 */
        .bgm‑player {
            position: fixed;
            bottom: 16px;
            left: 16px;
            width: 72px;
            height: 34px;
            z‑index: 999;
            opacity: 0.7;
            border‑radius: 20px;
        }
    </style>
</head>
<body>
    <!-- 开场点击提示遮罩 -->
    <div class="start‑overlay" id="overlay">
        <div class="start‑text">Click to Open Your Invitation</div>
    </div>

    <div class="video‑container">
        <video class="invite‑video" muted loop playsinline>
            <source src="./SolimanFionaWedding.mp4" type="video/mp4">
        </video>
        <!-- RSVP跳转链接 -->
        <a class="click‑link‑btn" href="https://zhengfangyuan128‑jpg.github.io/SolimanFangyuanwedding/" target="_blank"></a>
    </div>

    <audio class="bgm‑player" controls preload="auto" loop>
        <source src="./A.mp3" type="audio/mpeg">
    

    <script>
        const audio = document.querySelector('.bgm‑player');
        const overlay = document.getElementById('overlay');
        const video = document.querySelector('.invite‑video');

        overlay.addEventListener('click', ()=>{
            overlay.style.display = 'none';
            video.play();
            if(audio.paused) audio.play();
        });
    </script>
</body>
</html>
</html>
