<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SolimanFionaWedding</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #000000;
        }
        /* 开场遮罩 */
        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.65);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .start-text {
            color: #ffffff;
            font-size: 22px;
            letter-spacing: 3px;
            font-family: serif;
            text-shadow: 0 0 8px #e8d8ff, 0 0 16px #c8b0e8, 0 0 24px #b090d8;
            animation: dreamBreath 3.2s ease-in-out infinite alternate;
        }
        @keyframes dreamBreath {
            0% {
                opacity: 0.75;
                text-shadow: 0 0 4px #e8d8ff, 0 0 10px #c8b0e8, 0 0 16px #b090d8;
            }
            100% {
                opacity: 1;
                text-shadow: 0 0 12px #f0e4ff, 0 0 22px #d4bcf0, 0 0 32px #bc9ee0;
            }
        }

        .video-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        .invite-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* RSVP热区：对准视频末尾粉色框中间空白位置 */
        .click-link-btn{
            position:absolute;
            top:42vh;
            left:25vw;
            right:25vw;
            height:16vh;
            z-index:960;
            /*调试看到红色块，正式上线注释本行*/
            background:rgba(255,0,0,0.25);
            display:flex;
            align-items:center;
            justify-content:center;
            color:#fff;
            font-size:18px;
            /* 默认：隐藏 + 禁止点击 */
            opacity:0;
            pointer-events:none;
            transition: opacity 0.4s ease;
        }
        /* 到视频末尾才激活显示 */
        .click-link-btn.show{
            opacity:1;
            pointer-events:auto;
        }

        .bgm-player {
            position: fixed;
            bottom: 16px;
            left: 16px;
            width: 72px;
            height: 34px;
            z-index: 999;
            opacity: 0.7;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="start-overlay" id="overlay">
        <div class="start-text">Click to Open Your Invitation</div>
    </div>

    <div class="video-container" id="videoWrap">
        <video class="invite-video" muted loop playsinline id="inviteVideo">
            <source src="./SolimanFionaWedding.mp4" type="video/mp4">
        </video>
        <!-- 真实Google表单RSVP链接 -->
        <a id="rsvpBtn" class="click-link-btn" href="https://docs.google.com/forms/d/e/1FAIpQLSeSToEOGgadSOi62ek_c9hjiqe9O1V5VI5F-3Z2blMD-ur07A/viewform?usp=header" target="_blank">RSVP</a>
    </div>

    <audio class="bgm-player" controls preload="auto" loop>
        <source src="./A.mp3" type="audio/mpeg">
    

    <script>
        const audio = document.querySelector('.bgm-player');
        const overlay = document.getElementById('overlay');
        const video = document.getElementById('inviteVideo');
        const rsvpBtn = document.getElementById('rsvpBtn');

        // 视频总时长25秒，20秒之后显示RSVP热区
        const showRsvpTime = 20;

        overlay.addEventListener('click', ()=>{
            overlay.style.display = 'none';
            video.play();
            if(audio.paused) audio.play();
        });

        // 根据播放时间控制RSVP显示，20秒后淡入出现
        video.addEventListener('timeupdate', ()=>{
            if(video.currentTime >= showRsvpTime){
                rsvpBtn.classList.add('show');
            }else{
                rsvpBtn.classList.remove('show');
            }
        });
    </script>
</body>
</html>
